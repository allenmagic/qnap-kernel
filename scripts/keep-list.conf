# localmodconfig 覆盖清单
# ---------------------------------------------------------------------------
# localmodconfig 只保留「快照时刻已加载」的模块，以下两类会被误删，必须强制拉回：
#   1. 快照时恰好没加载、但运行时必需的（wireguard / overlay / nfsd ...）
#   2. 仓库要求静态内置、不希望退化成 .ko 的关键驱动
#
# 语法：每行 "<y|m|n> CONFIG_选项名"，选项名不带 CONFIG_ 前缀。
#   y = 强制内置（编译进内核镜像）
#   m = 强制保留为可加载模块（仅 tristate 选项有效；bool 选项必须用 y）
#   n = 强制关闭（用于处理 choice 冲突，如 NO_HZ_FULL vs NO_HZ_IDLE）
# 生成后统一跑 make olddefconfig，Kconfig 会自行修正非法的 y/m 组合。
#
# ⚠️ 依赖顺序无所谓（最后统一 olddefconfig），但符号名和 bool/tristate 类型必须
# 与内核 Kconfig 一致，否则该行会被静默丢弃。可用以下方式核对：
#   tar -xJf <linux-src.tar.xz> --wildcards --no-anchored '*/Kconfig*' -C /tmp/ksrc
#   grep -rn '^\(menu\)\?config <选项名>$' /tmp/ksrc
# 修改本文件后必须重新执行 nix build .#genConfig 并提交新的 generated/*.config。
# ---------------------------------------------------------------------------


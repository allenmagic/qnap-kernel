name: Build & Cache QNAP Kernel

# 在 GitHub Runner 上编译内核与外部模块，并推送到 Cachix（qnap-kernel），
# 让 NAS 侧 nix 直接拉取二进制、不再本地编译。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的旧构建自动取消，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # name 必须与 flake.nix 的 nixConfig 及 NAS 的 substituters 一致。
      # CACHIX_AUTH_TOKEN 在仓库 Settings -> Secrets and variables -> Actions 配置；
      # 未配置时（如 fork 的 PR）只读不推，构建仍会执行。
      - name: Setup Cachix (qnap-kernel)
        uses: cachix/cachix-action@v15
        with:
          name: qnap-kernel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # nixpkgs 升级后符号可能改名/改类型，这一步会提前失败而不是悄悄丢配置
      - name: Verify keep-list against kernel source
        run: nix build .#genConfig --print-out-paths --verbose

      - name: Flake check (no build)
        run: nix flake check --no-build

      # 内核 derivation 有 out / dev / modules 三个输出，一次构建全部产出
      - name: Build kernel
        run: nix build .#packages.x86_64-linux.kernel --print-out-paths --verbose

      # qnap8528 外部模块（对本内核交叉编译），一并入缓存
      - name: Build qnap8528 module
        run: nix build .#packages.x86_64-linux.qnap8528-module --print-out-paths --verbose

      - name: Summary
        run: |
          echo "### 内核" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          nix path-info --extra-experimental-features 'nix-command flakes' -S \
            .#packages.x86_64-linux.kernel >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
